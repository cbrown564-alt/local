<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180">
  <style>
    :root { --dv-dog: #6f7c86; --dv-dog-ear: #57636c; --dv-ink: #1d2a30; }
  </style>
  <!-- tail, behind everything -->
  <path d="M136 164 C154 162 158 142 151 126" fill="none" stroke="var(--dv-dog)" stroke-width="9" stroke-linecap="round" />
  <!-- far front leg, shaded -->
  <rect x="73" y="112" width="15" height="62" rx="7.5" fill="var(--dv-dog-ear)" />
  <g fill="var(--dv-dog)">
    <!-- haunch -->
    <circle cx="112" cy="140" r="34" />
    <!-- back of body joining haunch to shoulders -->
    <path d="M70 84 C86 78 104 92 116 106 L120 150 L80 150 Z" />
    <!-- chest -->
    <ellipse cx="74" cy="108" rx="20" ry="30" transform="rotate(-12 74 108)" />
    <!-- neck -->
    <path d="M58 60 C66 58 80 60 86 70 L92 96 L60 104 C58 90 56 74 58 60 Z" />
    <!-- near front leg + paw -->
    <rect x="60" y="110" width="16" height="64" rx="8" />
    <ellipse cx="65" cy="170" rx="11" ry="4.5" />
    <!-- back paw -->
    <ellipse cx="98" cy="170" rx="15" ry="4.5" />
    <!-- head + muzzle -->
    <circle cx="70" cy="48" r="22" />
    <path d="M70 46 L46 47 C36 47 32 52 32 58 C32 65 38 70 48 70 L70 70 Z" />
  </g>
  <!-- haunch line -->
  <path d="M90 152 C94 132 108 120 124 120" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="2" stroke-linecap="round" />
  <!-- ear -->
  <path d="M70 30 C82 26 92 32 92 44 C92 58 88 72 80 76 C74 78 70 70 68 60 C66 50 64 36 70 30 Z" fill="var(--dv-dog-ear)" />
  <!-- eye -->
  <circle cx="58" cy="44" r="3" fill="var(--dv-ink)" />
  <circle cx="57" cy="43" r=".9" fill="#fff" />
  <!-- nose -->
  <ellipse cx="34.5" cy="52" rx="5" ry="4" fill="var(--dv-ink)" />
  <!-- mouth -->
  <path d="M37 63 C44 66 51 65 57 61" fill="none" stroke="var(--dv-ink)" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round" />
</svg>
