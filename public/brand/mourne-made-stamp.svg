<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 80" role="img" aria-labelledby="title desc">
  <title id="title">Mourne Made</title>
  <desc id="desc">Mourne Made maker's stamp with a gorse-yellow side tab and Dundrum plus Newcastle place line.</desc>
  <rect x="0" y="4" width="132" height="72" fill="#132029"/>
  <rect x="112" y="4" width="20" height="72" fill="#E0C14D"/>
  <g fill="#F4F8FA" font-family="Arial Narrow, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing=".5">
    <text x="10" y="34">MOURNE</text>
    <text x="10" y="62">MADE</text>
  </g>
  <g fill="#5A6570" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing=".8">
    <text x="148" y="34">DUNDRUM</text>
    <text x="148" y="49">+ NEWCASTLE</text>
  </g>
</svg>
