name: Verify

# Unfiltered `push` plus `pull_request` ran the whole suite twice for every
# pull request: the two events carry different `github.ref` values, so the
# concurrency group did not collapse them. Push now covers the default branch
# only; branch work is verified through its pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run full verification
        run: pnpm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
