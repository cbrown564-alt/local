name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome is only needed for the focused Cúpla geometry pins inside
      # `pnpm test:cupla` (phone-fold + caption hit-test). The retired journey
      # suite stays retired.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build site and check request handler
        run: pnpm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: "1"
